name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Kiểm thử Backend (nếu có thư mục backend riêng)
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_CNPM_NEW/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Project_CNPM_NEW/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  # 2. Kiểm thử và Build thử nghiệm Frontend
  frontend-build-test:
    name: Frontend Test & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_CNPM_NEW/my-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Project_CNPM_NEW/my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Verify Production Build
        run: npm run build
        env:
          # Đặt CI=true hoặc false tùy thuộc vào việc bạn muốn 
          # warning có làm sập pipeline hay không (Khuyến nghị sửa sạch warning để CI=true)
          CI: "true"